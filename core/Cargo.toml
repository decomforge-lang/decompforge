[package]
name = "decompforge-core"
description = "Nucleo de DecompForge: cargadores de binarios y base de datos de proyecto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
# Descompresion LZ4 por bloques de los segmentos NSO (RF-01).
lz4_flex = "0.11"
# Capstone 5 con solo las arquitecturas que usamos (menos C que compilar).
capstone = { version = "0.14", default-features = false, features = [
    "std",
    "full",
    "arch_mips",
    "arch_powerpc",
    "arch_arm",
    "arch_arm64",
    "arch_x86",
] }

[dev-dependencies]
# Las pruebas abren bases SQLite "ajenas" para comprobar los rechazos.
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1"
