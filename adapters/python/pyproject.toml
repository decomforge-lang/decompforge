[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decompforge-re"
version = "0.1.0"
description = "Cliente Python para el formato de intercambio re-1.0 de DecompForge"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["jsonschema>=4.18"]

[project.scripts]
decompforge-re = "decompforge_re.cli:main"

[tool.setuptools]
packages = ["decompforge_re"]
